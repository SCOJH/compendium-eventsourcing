name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # NEX-CI-49 — deux défauts distincts corrigés d'un coup, et le second
      # n'avait été vu par personne.
      #
      # (1) `--filter "FullyQualifiedName!~IntegrationTests"` excluait la suite
      #     d'intégration PAR SON NOM. Les 6 fichiers de `tests/Integration/`
      #     n'ont jamais tourné ici, et le vert des PR venait uniquement de
      #     l'assembly unitaire. Le 2026-08-23, sept tests écrits pour prouver
      #     les critères d'acceptation d'un P0 (#385 — la troncature silencieuse
      #     de flux) sont passés en revue et ont été fusionnés sans avoir été
      #     exécutés une seule fois.
      #
      # (2) `--logger "trx;LogFileName=test-results.trx"` donnait le MÊME nom de
      #     fichier à tous les projets de test. `dotnet test` sur la solution
      #     lance un vstest par projet, et le dernier écrasait les précédents.
      #     Le seul `.trx` archivé du run de cette PR porte `total="0"` et nomme
      #     l'assembly d'intégration — celui que le filtre avait vidé. La seule
      #     trace machine du run disait donc zéro test exécuté.
      #
      # `run-tests.sh` remplace les deux : un `.trx` par assembly, et un budget
      # de tests non exécutés (`tests/unrun-budget.tsv`, défaut ZÉRO) qui rougit
      # quand un test existe sans tourner. Voir docs/TESTING.md.
      - name: Test
        run: |
          bash scripts/run-tests.sh \
            --configuration Release \
            --no-build \
            --results-directory TestResults

      # Le harnais lui-même est testé, avec un `dotnet` bouchonné : il tourne
      # sans .NET ni Docker, en quelques secondes. Un garde qu'on n'éprouve pas
      # est une promesse — et celui-ci garde la porte par laquelle deux défauts
      # sont déjà passés.
      - name: Self-test the test harness
        run: bash scripts/selftest.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

      - name: Coverage report + 35% gate
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            -reports:'TestResults/**/coverage.cobertura.xml' \
            -targetdir:coverage-report \
            -reporttypes:'TextSummary;MarkdownSummary'
          cat coverage-report/Summary.txt
          # 35% gate: this gate runs UNIT tests only (measured 36.3% line coverage
          # at assembly time). The bulk of this domain's surface is raw Npgsql +
          # Dapper I/O that only integration tests against a real PostgreSQL can
          # exercise — the source repo reached ~70% only by including its
          # [RequiresDocker] integration suite. Raise this gate if integration
          # coverage is ever folded into CI.
          line_pct=$(awk '/^[[:space:]]*Line coverage:/ {gsub("%","",$NF); print $NF; exit}' coverage-report/Summary.txt)
          echo "Line coverage: ${line_pct}%"
          awk -v c="$line_pct" 'BEGIN { exit (c+0 >= 35) ? 0 : 1 }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14
