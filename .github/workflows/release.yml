name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write  # nuget.org Trusted Publishing (OIDC)

jobs:
  pack-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # MinVer needs full history

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # NEX-CI-49 — `--require-integration` et non le mode `auto` de la CI :
      # une publication ne doit pas partir sur des tests qui n'ont pas tourné.
      # Si Docker manque sur le runner, ce job échoue au lieu de publier un
      # paquet dont la moitié des garanties n'a jamais été vérifiée.
      - name: Test
        run: |
          bash scripts/run-tests.sh \
            --configuration Release \
            --no-build \
            --results-directory TestResults \
            --require-integration

      - name: Pack adapter packages (excluding tests)
        run: |
          mkdir -p artifacts
          # One packable project ships from this tag: the PostgreSQL adapter.
          # Every packable is Compendium.Adapters.* and never a *.Tests.
          while IFS= read -r csproj; do
            name=$(basename "$csproj" .csproj)
            if [[ "$name" == Compendium.Adapters.* && "$name" != *.Tests ]]; then
              echo "Packing $name"
              dotnet pack "$csproj" -c Release --no-build -o artifacts/
            fi
          done < <(find src -name '*.csproj')
          ls -la artifacts/
          count=$(ls artifacts/*.nupkg 2>/dev/null | wc -l)
          test "$count" -ge "1" || { echo "Expected at least 1 .nupkg in artifacts/ (postgresql adapter), found $count"; exit 1; }

      # GitHub Packages first: it only needs GITHUB_TOKEN, and downstream consumers
      # (Nexus Directory.Packages.props) restore from this feed.
      - name: Push to GitHub Packages (primary feed)
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/SCOJH/index.json \
            --skip-duplicate

      # Trusted Publishing: OIDC -> cle ephemere nuget.org (policy SCOJH/<repo> + release.yml, owner sachahennaut)
      - name: NuGet login (OIDC)
        id: nuget-login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: sachahennaut

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Pas de credential nuget.org : OIDC KO et NUGET_API_KEY vide."
            echo "::error::La release ne publie RIEN. Un warning ici a masque 5 semaines de faux vert (cf. sassy-backlog#432)."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-preview') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
